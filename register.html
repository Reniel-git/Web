<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</head>
<body>

<div class="container">

    <h2>Register</h2>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUser" placeholder="Enter username">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="Enter email"
         oninput="this.value=this.value.toLowerCase()">
    </div>

    <!-- PASSWORD -->
    <div class="form-group password-box">
        <label>Password</label>

        <div class="password-wrapper">
            <input type="password"
                   id="regPass"
                   placeholder="Enter password"
                   oninput="toggleEyeVisibility('regPass','regEye')">

            <span class="eye"
                  id="regEye"
                  onclick="togglePassword('regPass', this)"
                  style="display:none;">
                <i class="fa-solid fa-eye-slash"></i>
            </span>
        </div>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="form-group password-box">
        <label>Confirm Password</label>

        <div class="password-wrapper">
            <input type="password"
                   id="regConfirm"
                   placeholder="Confirm password"
                   oninput="toggleEyeVisibility('regConfirm','regConfirmEye')">

            <span class="eye"
                  id="regConfirmEye"
                  onclick="togglePassword('regConfirm', this)"
                  style="display:none;">
                <i class="fa-solid fa-eye-slash"></i>
            </span>
        </div>
    </div>

    <div id="regError" class="error"></div>

    <button onclick="registerUser()">Register</button>

    <div class="links">
        <a href="login.html" class="underline-link">Already have an account?</a>
    </div>

</div>

<script src="Js/script.js"></script>

</body>
</html>
