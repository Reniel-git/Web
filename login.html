<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</head>
<body>
<div class="container">
    <h2>Login</h2>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter email"
        onfocus="showRecentEmail()"
        oninput="this.value = this.value.toLowerCase(); hideSuggestion()">
    <div id="emailSuggestion" class="suggestion-box"></div>


    </div>
    <div class="form-group password-box">
    <label>Password</label>

    <div class="password-wrapper">
        <input type="password"
               id="loginPass"
               placeholder="Enter Password"
               oninput="toggleEyeVisibility('loginPass','loginEye')">

        <span class="eye"
              id="loginEye"
              onclick="togglePassword('loginPass', this)"
              style="display:none;">
            <i class="fa-solid fa-eye-slash"></i>
        </span>
    </div>
</div>


    <div id="loginError" class="error"></div>
    <button onclick="loginUser()">Login</button>
    <div class="links">
    <a href="register.html">Don't have an account? Register</a>
    <a href="forgot-pass.html">Forgot Password?</a>
</div>

</div>
<script src="Js/script.js"></script>
</body>
</html>
