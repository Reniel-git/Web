<!DOCTYPE html>
<html>
<head>
<title>Create Biodata</title>
<link rel="stylesheet" href="Css/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body class="create-biodata-page">

<div class="container">

<h2>Create Biodata</h2>

<!-- PERSONAL DATA -->

<label>Position Desired</label>
<input type="text" id="position"><br><br>

<label>Date Applied</label>
<input type="date" id="date"><br><br>

<label>Full Name</label>
<input type="text" id="name"><br><br>

<label>Email Address</label>
<input type="email" id="email"><br><br>

<label>Gender</label>
<input type="text" id="gender"><br><br>

<label>Height</label>
<input type="text" id="height"><br><br>

<label>Weight</label>
<input type="text" id="weight"><br><br>

<label>Telephone</label>
<input type="text" id="telephone"><br><br>

<label>Cellphone</label>
<input type="text" id="cellphone"><br><br>

<label>Date of Birth</label>
<input type="date" id="birth"><br><br>

<label>Place of Birth</label>
<input type="text" id="birthplace"><br><br>

<label>Civil Status</label>
<input type="text" id="civil"><br><br>

<label>Citizenship</label>
<input type="text" id="citizenship"><br><br>

<label>Religion</label>
<input type="text" id="religion"><br><br>

<label>Spouse</label>
<input type="text" id="spouse"><br><br>

<label>Occupation</label>
<input type="text" id="occupation"><br><br>

<label>Language / Dialect Spoken or Written</label>
<input type="text" id="language"><br><br>

<label>City Address</label>
<input type="text" id="city"><br><br>

<label>Provincial Address</label>
<input type="text" id="province"><br><br>

<!-- PARENTS -->

<h3>Parents Information</h3>

<label>Father's Name</label>
<input type="text" id="father"><br><br>

<label>Father's Occupation</label>
<input type="text" id="fatherjob"><br><br>

<label>Mother's Name</label>
<input type="text" id="mother"><br><br>

<label>Mother's Occupation</label>
<input type="text" id="motherjob"><br><br>

<!-- EMERGENCY -->

<h3>Emergency Contact</h3>

<label>Person to Contact</label>
<input type="text" id="emergency"><br><br>

<label>His/Her Address and Telephone</label>
<input type="text" id="emergencyDetails"><br><br>

<!-- CHILDREN -->

<h3>Children (Up to 3)</h3>

<label>Child 1 Name</label>
<input type="text" id="child1"><br><br>

<label>Child 1 Birth Date</label>
<input type="date" id="childBirth1"><br><br>

<label>Child 2 Name</label>
<input type="text" id="child2"><br><br>

<label>Child 2 Birth Date</label>
<input type="date" id="childBirth2"><br><br>

<label>Child 3 Name</label>
<input type="text" id="child3"><br><br>

<label>Child 3 Birth Date</label>
<input type="date" id="childBirth3"><br><br>

<!-- EDUCATIONAL BACKGROUND -->

<h3>Educational Background</h3>

<label>Elementary School</label>
<input type="text" id="elem"><br><br>

<label>Elementary Year Graduated</label>
<input type="date" id="elemYear"><br><br>

<label>High School</label>
<input type="text" id="hs"><br><br>

<label>High School Year Graduated</label>
<input type="date" id="hsYear"><br><br>

<label>College</label>
<input type="text" id="college"><br><br>

<label>College Year Graduated</label>
<input type="date" id="collegeYear"><br><br>

<label>Degree Received</label>
<input type="text" id="degree"><br><br>

<label>Special Skills</label>
<input type="text" id="skills"><br><br>


<!-- EMPLOYMENT -->

<h3>Employment Record</h3>

<label>Company 1</label>
<input type="text" id="company1"><br><br>

<label>Position</label>
<input type="text" id="position1"><br><br>

<label>Date From</label>
<input type="date" id="from1"><br><br>

<label>Date To</label>
<input type="date" id="to1"><br><br>

<label>Company 2</label>
<input type="text" id="company2"><br><br>

<label>Position</label>
<input type="text" id="position2"><br><br>

<label>Date From</label>
<input type="date" id="from2"><br><br>

<label>Date To</label>
<input type="date" id="to2"><br><br>

<!-- CHARACTER REFERENCE -->

<h3>Character Reference</h3>

<label>Reference 1 Name</label>
<input type="text" id="refname1"><br><br>

<label>Reference 1 Company</label>
<input type="text" id="refcompany1"><br><br>

<label>Reference 1 Position</label>
<input type="text" id="refposition1"><br><br>

<label>Reference 1 Contact</label>
<input type="text" id="refcontact1"><br><br>

<label>Reference 2 Name</label>
<input type="text" id="refname2"><br><br>

<label>Reference 2 Company</label>
<input type="text" id="refcompany2"><br><br>

<label>Reference 2 Position</label>
<input type="text" id="refposition2"><br><br>

<label>Reference 2 Contact</label>
<input type="text" id="refcontact2"><br><br>

<!-- GOVERNMENT INFO -->

<h3>Government Information</h3>

<label>Res. Cert. No.</label>
<input type="text" id="vrescert"><br><br>

<label>Contact No.</label>
<input type="text" id="vidcontact"><br><br>

<label>Issued At</label>
<input type="text" id="vissuedat"><br><br>

<label>Issued On</label>
<input type="date" id="vissuedon"><br><br>

<label>SSS</label>
<input type="text" id="vsss"><br><br>

<label>TIN</label>
<input type="text" id="vtin"><br><br>

<label>NBI No.</label>
<input type="text" id="vnbi"><br><br>

<label>Passport No</label>
<input type="text" id="vpassport"><br><br>

<label>Draw Your Signature</label>
<canvas id="signaturePad"
        width="375"
        height="120"
        style="border:1px solid black; display:block; margin-top:10px;">
</canvas>

<br>
<button type="button" onclick="clearSignature()">Clear Signature</button>

<label>Upload Photo</label>
<input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)">
<br>
<img id="photoPreview" style="display:none; width:150px; height:150px; border:1px solid black; margin-top:10px;">

<!-- SAVE BUTTON -->

<button onclick="saveBiodata()">Save and View</button>
<a href="dashboard.html" class="back-button">Back</a>

</div>

<script src="Js/script.js"></script>

</body>
</html>
