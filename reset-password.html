<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<link rel="stylesheet" href="Css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <!-- NEW PASSWORD -->
    <div class="form-group password-box">
        <label>New Password</label>
        <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Enter new password"
                   oninput="toggleEyeVisibility('newPassword','newEye')">

            <span class="eye" id="newEye"
                  onclick="togglePassword('newPassword', this)"
                  style="display:none;">
                <i class="fa-solid fa-eye-slash"></i>
            </span>
        </div>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="form-group password-box">
        <label>Confirm Password</label>
        <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm new password"
                   oninput="toggleEyeVisibility('confirmPassword','confirmEye')">

            <span class="eye" id="confirmEye"
                  onclick="togglePassword('confirmPassword', this)"
                  style="display:none;">
                <i class="fa-solid fa-eye-slash"></i>
            </span>
        </div>
    </div>

    <div id="resetError" class="error"></div>

    <button onclick="saveNewPassword()">Reset Password</button>

    <!-- FIXED POSITION -->
    <a href="login.html">Back to Login</a>

</div>

<script src="Js/script.js"></script>
</body>
</html>
